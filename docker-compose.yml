version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dineflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dineflow}
      POSTGRES_USER: ${POSTGRES_USER:-dineflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dineflow_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dineflow} -d ${POSTGRES_DB:-dineflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dineflow-network

  redis:
    image: redis:7-alpine
    container_name: dineflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dineflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dineflow-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dineflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dineflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dineflow_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dineflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dineflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dineflow-network

volumes:
  postgres_data:
  redis_data:

networks:
  dineflow-network:
    driver: bridge
