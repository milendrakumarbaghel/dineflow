spring.application.name=dineflow-backend
server.port=8080

# Default profile is dev (runs H2 in PostgreSQL mode for zero-setup demo/tests)
# Use SPRING_PROFILES_ACTIVE=postgres for production Docker / PostgreSQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security
dineflow.jwt.secret=${JWT_SECRET:DineFlowSuperSecureSecretKeyForRestaurantManagement2026AndBeyond!}
dineflow.jwt.expiration-ms=86400000

# Actuator & Monitoring
management.endpoints.web.exposure.include=health,info,metrics
